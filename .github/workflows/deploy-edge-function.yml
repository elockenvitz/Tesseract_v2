name: deploy-edge-function

# Manual, controlled production deployment of a single Supabase Edge Function.
#
# Security controls (see the security-closure plan):
#  1. workflow_dispatch ONLY — never on push / merge / pull_request (req 8). PR code
#     from a fork cannot trigger this, so untrusted code never sees the prod token (req 7).
#  2. Reuses the EXISTING secrets.SUPABASE_ACCESS_TOKEN; it is passed only as a masked job
#     env var, never echoed, and `supabase functions deploy` does not print it (req 2, 9).
#  3. `function` is a fixed choice allowlist (calendar-sync / market-events / market-news),
#     re-checked at runtime; auto-archive and holdings-sftp-sync are deliberately absent (req 3).
#  4. Production project ref is explicit and verified before any deploy: the operator must type
#     it into `confirm_prod_ref`, and it must equal the hard-coded PROD_REF (req 4).
#  5. Deploys an EXACT commit `sha`, checked out by SHA, and verified to be an ancestor of
#     origin/main (a reviewed/merged commit) — never an arbitrary unreviewed branch (req 5).
#  6. Runs in the `production` GitHub environment: if that environment has required reviewers,
#     GitHub enforces approval before the job runs. This workflow does not create or weaken any
#     environment protection — configure required reviewers on `production` to arm the gate (req 6).
#  7. Reuses the existing `npm run deploy:fn:prod` script; no existing script/workflow is modified (req 10).

on:
  workflow_dispatch:
    inputs:
      function:
        description: Edge Function to deploy (approved allowlist)
        required: true
        type: choice
        options:
          - calendar-sync
          - market-events
          - market-news
      sha:
        description: Exact commit SHA to deploy (must be merged to main)
        required: true
        type: string
      confirm_prod_ref:
        description: Type the production project ref to confirm (wfcebeagznzgeuyysbnt)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PROD_REF: wfcebeagznzgeuyysbnt
      ALLOWLIST: "calendar-sync market-events market-news"
    steps:
      - name: Verify production target and allowlist
        run: |
          set -euo pipefail
          echo "Requested function : ${{ inputs.function }}"
          echo "Requested sha      : ${{ inputs.sha }}"
          echo "Target project ref : $PROD_REF"
          if [ "${{ inputs.confirm_prod_ref }}" != "$PROD_REF" ]; then
            echo "::error::confirm_prod_ref did not match the production ref $PROD_REF. Refusing."
            exit 1
          fi
          case " $ALLOWLIST " in
            *" ${{ inputs.function }} "*) echo "Function is on the allowlist." ;;
            *) echo "::error::Function '${{ inputs.function }}' is not on the approved allowlist ($ALLOWLIST)."; exit 1 ;;
          esac

      - name: Checkout the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Verify the commit is reviewed (ancestor of origin/main)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${{ inputs.sha }}" origin/main; then
            echo "::error::${{ inputs.sha }} is not an ancestor of origin/main. Only reviewed/merged commits may deploy."
            exit 1
          fi
          echo "Commit is reachable from origin/main (reviewed)."

      - name: Verify the function exists at this commit
        run: |
          set -euo pipefail
          test -f "supabase/functions/${{ inputs.function }}/index.ts" \
            || { echo "::error::supabase/functions/${{ inputs.function }}/index.ts missing at ${{ inputs.sha }}"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy via the existing deploy script
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not configured for the production environment."
            exit 1
          fi
          # Reuses scripts/supabase-target.mjs, which targets the prod ref explicitly.
          npm run deploy:fn:prod -- "${{ inputs.function }}"
          echo "Deployed ${{ inputs.function }} to $PROD_REF from ${{ inputs.sha }}."

name: CI

# Runs on every PR targeting main or staging, and on direct pushes to those
# branches. The jobs gate merges via branch-protection rules — see
# docs/CONTRIBUTING.md for the contributor workflow that depends on them.
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  # Manual trigger. Both required jobs once sat at "Expected - waiting for
  # status to be reported" with no runs recorded at all, which is
  # indistinguishable from Actions being unavailable to the repository.
  # A button that can be pressed on demand separates the two, and is worth
  # having regardless for re-running checks without an empty commit.
  workflow_dispatch:

# Cancel in-flight runs when a new commit is pushed to the same PR — keeps the
# Actions billing minutes low and avoids confusing "stale check passed" badges.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── REMOVED: the repo-wide `Type check` job ────────────────────────────────
  #
  # It ran `npx tsc --noEmit` against tsconfig.json, which is a solution file —
  # "files": [] with project references. Plain tsc does not build referenced
  # projects, so it exited 0 unconditionally: a deliberately injected type error
  # produced exit 0. It checked nothing, for the whole life of this repo, while
  # reporting success on every PR page as a required status check.
  #
  # Deleted rather than renamed. A job that burns CI minutes to report a result
  # nobody may trust is worse than its absence, and a rename would have left a
  # required context that never reports, hanging every PR.
  #
  # `Type check (cards)` below is the real gate: scoped, ratcheted at zero, and
  # proven to fail on an injected error.

  typecheck-cards:
    name: Type check (cards)
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund --no-progress
      # The repo-wide `Type check` job runs `tsc --noEmit` against a solution
      # tsconfig with "files": [] and project references, which builds nothing
      # and exits 0 on an injected type error. It has never checked a file.
      # Fixing it wholesale needs a re-baseline of 8,841 errors; the card
      # surface is already at zero, so it is gated now.
      # Runs first inside the workflow: if this is reachable at all the file
      # parsed, and it then asserts the job set, that every needs: resolves, and
      # that the display names branch protection requires still exist.
      - run: npm run guard:ci
      - run: npm run guard:types

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      # supabase.ts throws on import if these aren't set. CI doesn't need to
      # actually reach Supabase — these dummy values just satisfy the
      # module-level guard so test files that transitively import it can
      # load. Any test that needs real Supabase access should mock the
      # client (e.g. with vi.mock).
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund --no-progress
      # --project unit runs only the unit-test project from vitest.config.ts.
      # The "storybook" project runs in browser mode via Playwright/Chromium,
      # which requires `npx playwright install` to download the browser
      # binaries (~150MB). Skipped here to keep CI fast; visual-regression
      # tests can move to a separate workflow with that install step.
      # CI=true makes Vitest exit instead of watching forever.
      - run: npm test -- --run --project unit
        env:
          CI: true

  layout:
    name: Card layout
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund --no-progress
      # Chromium only. The layout rules are claims about rendered geometry —
      # card height at 390px, horizontal overflow, whether a chart node exists
      # — and jsdom has no layout engine, so offsetHeight is always 0 there.
      # A rule that cannot be measured where it is tested regresses silently,
      # which is exactly how the eyebrow row came to overflow on all four card
      # types without anything noticing.
      - run: npx playwright install --with-deps chromium
      - run: npm run guard:tdz
      - run: npm run guard:layout
      # The screenshots are a by-product of the assertions, but they are the
      # fastest way for a human to see what changed in a review.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-cards
          path: artifacts/cards/
          retention-days: 30

  # TODO: add a tenant-boundary lint job once SUPABASE_URL and
  # SUPABASE_SERVICE_KEY are wired up as repository secrets. The script
  # in scripts/tenant-boundary-lint.mjs queries the DB to detect unsafe
  # cross-org access patterns, so it needs the service-role key. Until
  # then, run it manually via `npm run tenant:lint:all` with the env
  # vars set in .env.local.

  # ── Red main must reach a human the same day ──────────────────────────────
  #
  # Main's CI sat red across three merges on 11-13 Aug while Netlify published
  # every one of them. The org-scope guard had already named the file and line
  # of a cross-tenant leak; nobody was watching the dashboard, and there is no
  # reason anybody should have to.
  #
  # This opens a GitHub issue on the first red build and comments on it for
  # each subsequent one, so a standing failure is a single tracked thing
  # rather than a stream. Issues notify by email through normal repo watching,
  # which needs no SMTP secret and cannot silently expire the way a webhook
  # token does.
  notify-red-main:
    name: Alert on red main
    # typecheck was deleted (it checked nothing); this now waits on the
    # three real gates.
    needs: [typecheck-cards, test, layout]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'CI is red on main'
            const body = [
              `Main is failing as of ${new Date().toISOString()}.`,
              '',
              `Commit: ${context.sha.slice(0, 8)}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Netlify will NOT publish while the guard is failing — see the',
              'build command in netlify.toml. Production is pinned to the last',
              'green build until this is fixed.',
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-red',
            })

            if (existing.data.length) {
              // Comment rather than open a second issue: a standing failure is
              // one problem, and a stream of issues is how alerts get muted.
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ci-red'],
              })
            }

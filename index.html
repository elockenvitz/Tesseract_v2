    <!-- Applies before CSS loads, so the first paint (including the boot
         loader) uses the light palette instead of the OS's. The `dark` class
         overrides this via `:root.dark { color-scheme: dark }` in index.css. -->
    <meta name="color-scheme" content="light" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self';
                   worker-src 'self' blob:;
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: https: blob:;
                   font-src 'self' data:;
                   connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.alphavantage.co https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://api.perplexity.ai https://*.sentry.io https://*.ingest.sentry.io https://*.ingest.us.sentry.io;
                   frame-ancestors 'none';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Tesseract - Investment Dashboard</title>

    <!-- Initial loader painted by the browser before any JS runs.
         CRITICAL: lives OUTSIDE #root as a sibling so React's mount
         doesn't tear it down. It stays visible across the full cold
         boot — ProtectedRoute auth check, OrganizationContext resolve,
         DashboardPage pilot gate — and only fades out once the app
         signals readiness. Without this, each gate remounts its own
         spinner and the CSS rotation animation restarts, producing
         the visible "three loading screens" jank. -->
    <style>
      #tesseract-boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: #f9fafb;
        z-index: 2147483647;
        font: 500 12px/1 -apple-system, system-ui, sans-serif;
        color: #9ca3af;
        opacity: 1;
        transition: opacity 220ms ease-out;
      }
      #tesseract-boot-loader.is-fading {
        opacity: 0;
        pointer-events: none;
      }
      /* The mark itself, at the size the app's own loaders use, so the
         handover when React mounts is the same figure in the same place
         rather than one loading screen replacing another.

         It is the RESTING frame: static geometry, generated from
         `lib/brand/tesseract-geometry` so it cannot drift from the animated
         version. It cannot turn here — the projection is computed per frame in
         JavaScript, and this has to paint before any JavaScript runs, which is
         the whole reason it exists.

         A slow breath instead. Enough to say the page is alive, cheap enough
         to composite on a main thread that is busy parsing the bundle, and it
         resolves into the animated mark rather than being swapped for it. */
      #tesseract-boot-loader svg {
        width: 96px;
        height: 96px;
        animation: tesseract-boot-breathe 2.4s ease-in-out infinite;
      }
      @keyframes tesseract-boot-breathe {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 1; }
      }
      /* Held still for anybody who has asked for that. A pulsing brand mark is
         milder than an inverting hypercube, but the setting means what it
         says, and the resting frame is already the recognisable projection. */
      @media (prefers-reduced-motion: reduce) {
        #tesseract-boot-loader svg { animation: none; opacity: 1; }
      }
    </style>

[build]
  # The guard runs BEFORE the build, and a failure here means nothing
  # publishes.
  #
  # This is the actual fix for a two-day cross-tenant leak. The org-scope
  # guard named the offending file and line the moment it was introduced,
  # and main's CI sat red across three merges (11-13 Aug) while Netlify
  # published every one of them — because the build command was `vite build`
  # and Vite does not run tests. The guard could fail forever without
  # stopping a deploy.
  #
  # Deliberately narrow: the scope and signal guards, not the full suite. A
  # gate that blocks deploys for unrelated flakes is a gate somebody deletes,
  # and these are the two that protect the tenant boundary. Widening it is
  # one word.
  # guard:unit, not guard. The full guard now also runs the Playwright layout
# assertions, which need a Chromium download (~115MB) on every deploy — and
# whether Netlify's image tolerates that is exactly the kind of thing this
# project has assumed and been wrong about before (see
# docs/tickets/netlify-branch-deploy-gate-unproven.md). The layout rules are
# enforced instead as a required status check on main, which blocks the merge
# rather than the deploy — a strictly earlier gate.
command = "npm run guard:unit && npm run guard:tdz && npm run build"

  # Whether to build at all.
  #
  # Netlify's convention is inverted from everything else here: exit 0 SKIPS,
  # non-zero BUILDS. The script says so at the top so nobody has to remember.
  #
  # Every push to every branch was producing a preview, and this build runs two
  # guards plus a Vite build of an 8MB bundle with a 7GB heap. That is minutes
  # of build time to look at a card on a phone — which `npm run dev:mobile`
  # does with real data, hot reload and no build at all.
  #
  # `main` always builds. `[preview]` in a commit message opts that commit in,
  # for the times a real deploy URL is the point.
  ignore = "node scripts/netlify-should-build.mjs"

  # Netlify only auto-detects netlify/functions when no [build] block sets
  # otherwise; naming it explicitly means adding a function never depends on
  # detection behaviour.
  functions = "netlify/functions"

[build.environment]
  # Vite's source-map generation balloons memory for our 8MB bundle —
  # default 2GB heap and our first 4GB bump both OOM during chunk
  # rendering. 8GB is what Netlify's build VMs provide; we sit just
  # under it and leave a bit of headroom for the OS.
  NODE_OPTIONS = "--max-old-space-size=7168"
